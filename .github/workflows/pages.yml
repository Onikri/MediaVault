name: Validate and deploy MediaVault

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mediavault-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-runtime.txt

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install -r server/requirements-runtime.txt

      - name: Build and validate encrypted media
        run: |
          npm run build
          npm test
          npm run test:server
          npm run test:notebook

      - name: Responsive UI and browser integration
        timeout-minutes: 5
        env:
          MEDIA_VAULT_SKIP_BUILD: '1'
        run: |
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROMIUM_PATH"
          export CHROMIUM_PATH
          npm run test:ui
          npm run test:browser
          npm run test:automatic

      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediavault-visual-tests
          path: test-output/*.png
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
