name: Validate and deploy MediaVault

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mediavault-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-service.txt

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install -r server/requirements-service.txt
          python -m pip install httpx==0.28.1
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi

      - name: Build and validate encrypted media
        run: |
          npm run build
          npm test

      - name: Validate server and queue recovery
        run: |
          mkdir -p test-output
          set +e
          npm run test:server 2>&1 | tee test-output/server-ci.log
          result=${PIPESTATUS[0]}
          python - "$result" <<'PY'
          import re,sys
          from pathlib import Path
          if sys.argv[1]!='0':
              text=Path('test-output/server-ci.log').read_text()
              for file,line in sorted(set(re.findall(r'File "[^"\n]*?((?:tests|server|scripts)/[a-zA-Z0-9_-]+\.py)", line ([0-9]+)',text))):
                  print('::error file='+file+',line='+line+'::Server validation failed at this code location.')
          PY
          exit "$result"

      - name: Validate notebook checksums
        run: |
          npm run test:notebook

      - name: Responsive UI and browser integration
        timeout-minutes: 8
        env:
          MEDIA_VAULT_SKIP_BUILD: '1'
        run: |
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROMIUM_PATH"
          export CHROMIUM_PATH
          mkdir -p test-output
          set +e
          {
            npm run test:ui &&
            npm run test:browser &&
            npm run test:voices &&
            npm run test:design &&
            npm run test:manga &&
            npm run test:music &&
            npm run test:online &&
            npm run test:trusted
          } 2>&1 | tee test-output/browser-ci.log
          result=${PIPESTATUS[0]}
          {
            echo '### Browser validation'
            echo "Exit code: $result"
            # Export only fixed error classes and code locations, never page text,
            # request URLs, account data, or arbitrary test-log payloads.
            python - "$result" <<'PY'
          import re,sys
          from pathlib import Path
          text=Path('test-output/browser-ci.log').read_text()
          for value in sorted(set(re.findall(r'\b(?:TimeoutError|AssertionError|TypeError|ReferenceError)\b',text))):
              print('Error class: '+value)
          for value in sorted(set(re.findall(r'tests/[a-zA-Z0-9_-]+\.(?:cjs|mjs|js):[0-9]+(?::[0-9]+)?',text))):
              print('Test location: '+value)
              if sys.argv[1]!='0':
                  file,line,*_=value.split(':')
                  print('::error file='+file+',line='+line+'::Browser validation failed at this test location.',file=sys.stderr)
          PY
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"

      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediavault-visual-tests
          path: test-output/*.png
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
