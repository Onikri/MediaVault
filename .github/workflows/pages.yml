name: Validate and deploy MediaVault

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish current main after full validation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Keep an explicit audit running when another release is pushed.
  group: mediavault-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && !inputs.deploy && github.run_id || 'latest' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A trusted main-branch push can publish once at the owner's explicit request.
    # All subsequent ordinary pushes retain the complete validation pipeline.
    env:
      PUBLISH_NOW: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-now]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        if: env.PUBLISH_NOW != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-service.txt

      - name: Install Node dependencies
        timeout-minutes: 7
        run: |
          npm ci --no-audit --no-fund --fetch-retries=2 --fetch-timeout=120000

      - name: Install Python dependencies
        if: env.PUBLISH_NOW != 'true'
        timeout-minutes: 7
        run: |
          python -m pip install --timeout 30 --retries 2 -r server/requirements-service.txt
          python -m pip install --timeout 30 --retries 2 -r server/requirements-batch.txt

      - name: Ensure ffmpeg is available
        if: env.PUBLISH_NOW != 'true'
        timeout-minutes: 3
        run: |
          if ! command -v ffmpeg >/dev/null; then
            # The hosted image's Azure HTTP mirror can stall on large codecs.
            # Keep Ubuntu's signed packages and use its official HTTPS mirrors.
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            if [ -f /etc/apt/apt-mirrors-security.txt ]; then
              printf '%s\n' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
            fi
            sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=20 update -qq
            sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg
          fi

      - name: Build current site
        run: |
          npm run build
          if [ "$PUBLISH_NOW" != "true" ]; then npm test; fi

      - name: Validate server and queue recovery
        if: env.PUBLISH_NOW != 'true'
        run: |
          mkdir -p test-output
          set +e
          npm run test:server 2>&1 | tee test-output/server-ci.log
          result=${PIPESTATUS[0]}
          python - "$result" <<'PY'
          import re,sys
          from pathlib import Path
          if sys.argv[1]!='0':
              text=Path('test-output/server-ci.log').read_text()
              for file,line in sorted(set(re.findall(r'File "[^"\n]*?((?:tests|server|scripts)/[a-zA-Z0-9_-]+\.py)", line ([0-9]+)',text))):
                  print('::error file='+file+',line='+line+'::Server validation failed at this code location.')
          PY
          exit "$result"

      - name: Validate notebook checksums
        if: env.PUBLISH_NOW != 'true'
        run: |
          npm run test:notebook

      - name: Source catalogue browser contracts
        if: env.PUBLISH_NOW != 'true'
        timeout-minutes: 5
        env:
          MEDIA_VAULT_SKIP_BUILD: '1'
        run: |
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROMIUM_PATH"
          export CHROMIUM_PATH
          node tests/content-management-browser.cjs
          npm run test:world
          npm run test:suwayomi

      - name: Library playback and gesture browser contract
        if: env.PUBLISH_NOW != 'true'
        timeout-minutes: 5
        env:
          MEDIA_VAULT_SKIP_BUILD: '1'
        run: |
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROMIUM_PATH"
          export CHROMIUM_PATH
          npm run test:browser

      - name: Direct translation browser contract
        if: env.PUBLISH_NOW != 'true'
        timeout-minutes: 4
        env:
          MEDIA_VAULT_SKIP_BUILD: '1'
        run: |
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROMIUM_PATH"
          export CHROMIUM_PATH
          npm run test:direct

      - name: Responsive UI and browser integration
        if: ${{ !cancelled() && env.PUBLISH_NOW != 'true' }}
        timeout-minutes: 25
        env:
          MEDIA_VAULT_SKIP_BUILD: '1'
        run: |
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROMIUM_PATH"
          export CHROMIUM_PATH
          mkdir -p test-output
          set +e
          {
            failures=0
            for suite in blossom design watch ui vm blocks cleaning migan voices manga reader music online translation gpu lmt gemma trusted rooms library-layout cards music-nav downloads; do
              npm run "test:$suite"
              code=$?
              if [ "$code" -ne 0 ]; then failures=$((failures + 1)); fi
            done
            test "$failures" -eq 0
          } 2>&1 | tee test-output/browser-ci.log
          result=${PIPESTATUS[0]}
          {
            echo '### Browser validation'
            echo "Exit code: $result"
            # Export only fixed error classes and code locations, never page text,
            # request URLs, account data, or arbitrary test-log payloads.
            python - "$result" <<'PY'
          import re,sys
          from pathlib import Path
          text=Path('test-output/browser-ci.log').read_text()
          for value in sorted(set(re.findall(r'\b(?:TimeoutError|AssertionError|TypeError|ReferenceError)\b',text))):
              print('Error class: '+value)
          for value in sorted(set(re.findall(r'tests/[a-zA-Z0-9_-]+\.(?:cjs|mjs|js):[0-9]+(?::[0-9]+)?',text))):
              print('Test location: '+value)
              if sys.argv[1]!='0':
                  file,line,*_=value.split(':')
                  print('::error file='+file+',line='+line+'::Browser validation failed at this test location.',file=sys.stderr)
          PY
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"

      - name: Upload UI previews
        if: always() && env.PUBLISH_NOW != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mediavault-visual-tests
          path: |
            test-output/*.png
            .codex-local/test-output/blossom/*.png
            .codex-local/test-output/watch/*.png
            .codex-local/test-output/navigation/*.png
            .codex-local/test-output/content-management/*.png
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    # Audits never publish; an explicit publication shares main's concurrency group.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check release is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          echo "publish=$([ "$head" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        if: steps.current.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Deploy
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000
