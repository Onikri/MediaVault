name: Refresh public manga taxonomy

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
  push:
    branches:
      - main
      - feature/hmanga-native-source-20261113
    paths:
      - .github/workflows/manga-tags.yml
      - scripts/sync-manga-tags.py
      - server/manga_source_coverage.py
      - server/manga_source_tags.py
      - server/manga_catalog_index.py
      - tests/test_manga_tag_snapshot.py

permissions:
  contents: write
  actions: write

concurrency:
  group: manga-taxonomy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-service.txt
      - name: Install bounded taxonomy dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 'httpx[http2]==0.28.1'
      - name: Validate taxonomy parser with offline fixtures
        run: python -m unittest discover -s tests -p 'test_manga_tag_snapshot.py'
      - name: Collect public tag and genre taxonomies
        run: python scripts/sync-manga-tags.py --output public/data/manga-tags.json
      - name: Validate output structure and coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public/data/manga-tags.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['schemaVersion']==1
          assert len(d['sources'])==18
          assert len({v['domain'] for v in d['sources']})==18
          assert isinstance(d['tags'],list)
          for t in d['tags']:
              assert t['key'] and t['label']
              assert t['sources'] and set(t['sources']).issubset({s['domain'] for s in d['sources']})
          print('Validated',len(d['tags']),'tag keys across',len(d['sources']),'sources')
          PY
      - name: Commit static vocabulary if updated
        id: publish
        shell: bash
        run: |
          if git diff --quiet -- public/data/manga-tags.json; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "Tag vocabulary did not change" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/manga-tags.json
          git commit -m "chore: refresh public manga taxonomy snapshot [skip ci]"
          # The branch may advance while the HTTP collection is running.
          # Rebase on the latest head; never force-push or erase user commits.
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              echo "::error::Cannot safely rebase the generated taxonomy; branch changed with conflicting data."
              exit 1
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              pushed=true
              break
            fi
            sleep 3
          done
          if [[ "$pushed" != "true" ]]; then
            echo "::error::Unable to push taxonomy after safe retries."
            exit 1
          fi
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "Manga tags updated on ${GITHUB_REF_NAME}." >> "$GITHUB_STEP_SUMMARY"
      - name: Rebuild public frontend with the new static file
        if: steps.publish.outputs.updated == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -f deploy=true
